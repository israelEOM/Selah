services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-selah}
      POSTGRES_USER: ${POSTGRES_USER:-selah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-selah} -d ${POSTGRES_DB:-selah}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./apps/api
    env_file: .env
    volumes:
      - ./apps/api:/app
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: ./apps/api
    command: celery -A app.tasks.celery_app worker --loglevel=INFO
    env_file: .env
    volumes:
      - ./apps/api:/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    build: ./apps/web
    env_file: .env
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:

